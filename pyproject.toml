[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukagaka-emotion"
version = "0.1.0"
description = "Local Japanese emotion classification prototype"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["projects/ukagaka-emotion"]
testpaths = ["projects/ukagaka-emotion/tests"]
